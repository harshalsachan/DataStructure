<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BST Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ─── Header ─────────────────────────────────────────── -->
  <header class="header">
    <div class="header-left">
      <span class="header-icon" aria-hidden="true">🌳</span>
      <h1 class="header-title">Binary Search Tree Visualizer</h1>
    </div>
    <button id="theme-toggle" class="btn btn-icon" title="Toggle light / dark theme"
            aria-label="Toggle light/dark theme">🌙</button>
  </header>

  <!-- ─── Main 3-Column Layout ─────────────────────────── -->
  <main class="main">

    <!-- ── Left panel: Controls ── -->
    <aside class="panel panel-left" aria-label="Controls">

      <section class="section">
        <h2 class="section-title">⚙️ Operations</h2>
        <input type="number" id="node-input" class="node-input"
               placeholder="Enter value…" min="-9999" max="9999"
               aria-label="Node value" />
        <div class="btn-group">
          <button id="btn-insert" class="btn btn-success">➕ Insert</button>
          <button id="btn-delete" class="btn btn-danger" >🗑️ Delete</button>
          <button id="btn-search" class="btn btn-warning">🔍 Search</button>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">🔄 Traversals</h2>
        <div class="btn-group">
          <button id="btn-inorder"    class="btn btn-traversal">In-order</button>
          <button id="btn-preorder"   class="btn btn-traversal">Pre-order</button>
          <button id="btn-postorder"  class="btn btn-traversal">Post-order</button>
          <button id="btn-levelorder" class="btn btn-traversal">Level-order</button>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">🛠️ Tree</h2>
        <div class="btn-group">
          <button id="btn-random" class="btn btn-secondary">🎲 Random</button>
          <button id="btn-clear"  class="btn btn-secondary">🧹 Clear</button>
        </div>
        <div class="btn-group">
          <button id="btn-export-json" class="btn btn-secondary">📤 JSON</button>
          <button id="btn-export-img"  class="btn btn-secondary">🖼️ Image</button>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">🎨 Legend</h2>
        <div class="legend">
          <div class="legend-item"><span class="legend-dot dot-new"      ></span><span>Inserted / Found</span></div>
          <div class="legend-item"><span class="legend-dot dot-comparing"></span><span>Comparing</span></div>
          <div class="legend-item"><span class="legend-dot dot-deleting" ></span><span>Deleting</span></div>
          <div class="legend-item"><span class="legend-dot dot-traversal"></span><span>Traversal</span></div>
          <div class="legend-item"><span class="legend-dot dot-path"     ></span><span>Search Path</span></div>
        </div>
      </section>

    </aside>

    <!-- ── Center: Canvas ── -->
    <div class="canvas-wrapper">
      <canvas id="bst-canvas" aria-label="BST visualization"></canvas>

      <!-- Traversal sequence banner (slides up from bottom of canvas) -->
      <div id="traversal-banner" class="traversal-banner hidden" aria-live="polite">
        <span id="traversal-label" class="traversal-type"></span>
        <div id="traversal-values" class="traversal-values"></div>
      </div>
    </div>

    <!-- ── Right panel: Metrics ── -->
    <aside class="panel panel-right" aria-label="Tree Metrics">
      <h2 class="section-title">📊 Metrics</h2>

      <div class="metric-grid">
        <div class="metric-card">
          <div class="metric-val" id="m-height">—</div>
          <div class="metric-lbl">Height</div>
        </div>
        <div class="metric-card">
          <div class="metric-val" id="m-nodes">0</div>
          <div class="metric-lbl">Nodes</div>
        </div>
        <div class="metric-card">
          <div class="metric-val" id="m-min">—</div>
          <div class="metric-lbl">Minimum</div>
        </div>
        <div class="metric-card">
          <div class="metric-val" id="m-max">—</div>
          <div class="metric-lbl">Maximum</div>
        </div>
        <div class="metric-card">
          <div class="metric-val" id="m-bf">—</div>
          <div class="metric-lbl">Balance Factor</div>
        </div>
        <div class="metric-card">
          <div class="metric-val" id="m-cmp">0</div>
          <div class="metric-lbl">Comparisons</div>
        </div>
      </div>

      <div id="balance-badge" class="balance-badge neutral">Empty Tree</div>
    </aside>

  </main>

  <!-- ─── Animation Controls Bar ─────────────────────────── -->
  <div class="controls-bar">
    <div class="ctrl-group">
      <label class="ctrl-label" for="speed-slider">⚡ Speed</label>
      <input type="range" id="speed-slider" class="slider"
             min="1" max="10" value="5" aria-label="Animation speed" />
      <span id="speed-display" class="ctrl-val">5×</span>
    </div>

    <div class="ctrl-group">
      <button id="btn-step"   class="btn btn-control" title="Advance one step (step-through mode)">⏭ Step</button>
      <button id="btn-pause"  class="btn btn-control" title="Pause / Resume">⏸ Pause</button>
      <button id="btn-replay" class="btn btn-control" title="Replay last operation">🔄 Replay</button>
    </div>

    <div class="ctrl-group">
      <label class="ctrl-label toggle-label">
        <input type="checkbox" id="step-mode" />
        <span>Step-through Mode</span>
      </label>
    </div>
  </div>

  <!-- ─── Status Bar ───────────────────────────────────────── -->
  <div class="status-bar" role="status" aria-live="polite">
    <span id="status-msg">Ready — insert a node to get started!</span>
  </div>

  <script src="bst.js"></script>
</body>
</html>
